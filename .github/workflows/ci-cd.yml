name: Productive Point CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── Job 1: Node.js Frontend & Express Server Build & Lint ───────────────────
  node-check:
    name: Build & Typecheck (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Run TypeScript typecheck
        run: npm run lint

      - name: Build production assets (Vite + esbuild)
        run: npm run build

  # ── Job 2: Python RAG Microservice Verification ─────────────────────────────
  python-check:
    name: Verify Python RAG Microservice
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rag_service/requirements.txt

      - name: Check Python syntax & compilation
        run: |
          python -m py_compile rag_service/main.py
          python -m py_compile rag_service/rag_engine.py

  # ── Job 3: Docker Container Build & Validation ─────────────────────────────
  docker-build:
    name: Build & Validate Docker Container
    needs: [node-check, python-check]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: productive-point-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 4: Automated Deployment Trigger (Optional) ─────────────────────────
  deploy:
    name: Deploy Application
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook (if secret configured)
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Triggering deployment to Render..."
          curl -X POST "$RENDER_DEPLOY_HOOK"
