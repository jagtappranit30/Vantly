services:
  db:
    image: postgres:15-alpine
    container_name: vantly-db
    environment:
      POSTGRES_DB: vantly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vantly"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vantly-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - SQL_HOST=db
      - SQL_PORT=5432
      - SQL_DB_NAME=vantly
      - SQL_USER=postgres
      - SQL_PASSWORD=postgres
      - SQL_ADMIN_USER=postgres
      - SQL_ADMIN_PASSWORD=postgres
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:7b}
      - RAG_SERVICE_URL=${RAG_SERVICE_URL:-http://127.0.0.1:8000}
      - VECTOR_STORE_FILE=/app/rag_service/data/vector_store.json
      - NODE_ENV=production
    volumes:
      - ragdata:/app/rag_service/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

volumes:
  pgdata:
  ragdata:
